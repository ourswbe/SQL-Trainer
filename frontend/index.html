<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL Trainer</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #131a2e;
        --panel-2: #1a2340;
        --text: #eaf0ff;
        --muted: #9cabcf;
        --accent: #6ea8fe;
        --accent-2: #8c7bff;
        --success: #2fd180;
        --danger: #ff6b7a;
        --border: #2a355f;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 20% -10%, #253764 0%, rgba(37, 55, 100, 0) 45%),
          radial-gradient(circle at 85% 120%, #392760 0%, rgba(57, 39, 96, 0) 38%),
          var(--bg);
        font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      }

      .container {
        width: min(1200px, 94vw);
        margin: 24px auto 50px;
      }

      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 16px;
      }

      .title {
        font-size: clamp(24px, 4vw, 38px);
        font-weight: 800;
        margin: 0;
        letter-spacing: 0.2px;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .badge {
        border: 1px solid var(--border);
        background: linear-gradient(135deg, rgba(110,168,254,.25), rgba(140,123,255,.25));
        color: #fff;
        padding: 8px 12px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 12px;
      }

      .layout {
        display: grid;
        gap: 14px;
        grid-template-columns: 360px 1fr;
      }

      .card {
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 16px;
      }

      h2, h3 { margin: 0 0 12px; }
      h3 { font-size: 18px; }

      .hidden { display: none !important; }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }

      label { font-size: 12px; color: var(--muted); }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--border);
        background: #0f1530;
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        outline: none;
      }

      textarea {
        min-height: 260px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        line-height: 1.45;
      }

      input:focus, select:focus, textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(110, 168, 254, 0.2);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        border: 1px solid var(--border);
        background: #212c51;
        color: #e7eeff;
        padding: 9px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover { filter: brightness(1.1); }
      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border: none;
      }
      .btn-success { background: rgba(47, 209, 128, 0.18); border-color: rgba(47, 209, 128, .45); }
      .btn-danger { background: rgba(255, 107, 122, 0.18); border-color: rgba(255, 107, 122, .45); }

      .status {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 14px;
      }
      .status.info { background: rgba(110,168,254,.14); border: 1px solid rgba(110,168,254,.35); }
      .status.ok { background: rgba(47,209,128,.14); border: 1px solid rgba(47,209,128,.35); }
      .status.err { background: rgba(255,107,122,.14); border: 1px solid rgba(255,107,122,.35); }

      .meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
      }
      .pill {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .pill b { color: var(--text); }

      .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
      .tab {
        font-size: 13px;
        padding: 7px 11px;
        border-radius: 999px;
      }

      .result {
        margin-top: 12px;
        max-height: 420px;
        overflow: auto;
        border-radius: 10px;
        border: 1px solid var(--border);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #0f1530;
      }
      th, td {
        border-bottom: 1px solid #253156;
        padding: 9px 10px;
        font-size: 13px;
        text-align: left;
      }
      th { position: sticky; top: 0; background: #162043; z-index: 1; }

      .empty {
        color: var(--muted);
        text-align: center;
        padding: 20px;
      }

      .footer-note {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }

      @media (max-width: 980px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="hero">
        <div>
          <h1 class="title">SQL Trainer</h1>
          <p class="subtitle">Практика SQL-запросов с автопроверкой, схемой БД и трекингом прогресса.</p>
        </div>
        <div class="badge">MVP • FastAPI + SQLite</div>
      </section>

      <section id="auth" class="card">
        <h3>Вход / регистрация</h3>
        <div class="field">
          <label>Логин</label>
          <input id="username" placeholder="например: student1" />
        </div>
        <div class="field">
          <label>Пароль</label>
          <input id="password" type="password" placeholder="минимум 4 символа" />
        </div>
        <div class="row">
          <button class="btn-primary" onclick="register()">Регистрация</button>
          <button onclick="login()">Войти</button>
        </div>
        <div id="authMsg" class="status info hidden"></div>
      </section>

      <section id="app" class="layout hidden">
        <aside class="card">
          <h3>Задания</h3>
          <div class="field">
            <label>Выбери задачу</label>
            <select id="taskSelect" onchange="loadTask()"></select>
          </div>
          <div id="taskDetails" class="empty">Выберите задание...</div>
          <div class="footer-note">Проверка идёт по сравнению результата запроса с эталоном.</div>
        </aside>

        <main class="card">
          <h3>SQL Editor</h3>
          <textarea id="query">SELECT * FROM students ORDER BY id;</textarea>
          <div class="row" style="margin-top: 10px;">
            <button class="btn-success" onclick="runQuery()">Выполнить</button>
            <button class="btn-primary" onclick="checkTask()">Проверить</button>
            <button class="btn-danger" onclick="clearEditor()">Очистить</button>
          </div>

          <div class="tabs" style="margin-top: 12px;">
            <button class="tab" onclick="loadSchema()">Схема БД</button>
            <button class="tab" onclick="loadProgress()">Мой прогресс</button>
            <button class="tab" onclick="showLastResult()">Результат запроса</button>
          </div>

          <div id="status" class="status info hidden"></div>
          <div id="output" class="result"><div class="empty">Здесь будет результат запроса или информация по вкладкам.</div></div>
        </main>
      </section>
    </div>

    <script>
      let token = localStorage.getItem('token') || '';
      let tasks = [];
      let lastResult = null;

      function authHeaders() {
        return { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };
      }

      function setStatus(message, type = 'info', auth = false) {
        const target = document.getElementById(auth ? 'authMsg' : 'status');
        target.classList.remove('hidden', 'info', 'ok', 'err');
        target.classList.add(type);
        target.innerText = message;
      }

      function showApp() {
        document.getElementById('auth').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
      }

      async function register() { await authCall('/api/auth/register'); }
      async function login() { await authCall('/api/auth/login'); }

      async function authCall(path) {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          setStatus('Введите логин и пароль.', 'err', true);
          return;
        }

        const r = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await r.json();

        if (!r.ok) {
          setStatus(data.detail || 'Ошибка авторизации.', 'err', true);
          return;
        }

        token = data.token;
        localStorage.setItem('token', token);
        setStatus('Успешно! Загружаю задания...', 'ok', true);
        showApp();
        await loadTasks();
      }

      async function loadTasks() {
        const r = await fetch('/api/tasks', { headers: authHeaders() });
        if (!r.ok) {
          setStatus('Не удалось загрузить задания.', 'err');
          return;
        }

        tasks = await r.json();
        const select = document.getElementById('taskSelect');
        select.innerHTML = tasks.map(t => `<option value="${t.id}">${t.id}. ${t.title}</option>`).join('');
        if (tasks.length) loadTask();
      }

      function loadTask() {
        const id = Number(document.getElementById('taskSelect').value);
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        document.getElementById('taskDetails').innerHTML = `
          <p>${task.description}</p>
          <div class="meta">
            <div class="pill">Сложность: <b>${task.difficulty}</b></div>
            <div class="pill">Тема: <b>${task.topic}</b></div>
          </div>
        `;
      }

      function renderTable(result) {
        if (!result || !result.columns || result.columns.length === 0) {
          return '<div class="empty">Нет данных для отображения.</div>';
        }

        const head = `<tr>${result.columns.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr>`;
        const body = result.rows.map(r => `<tr>${result.columns.map(c => `<td>${escapeHtml(String(r[c] ?? ''))}</td>`).join('')}</tr>`).join('');
        return `<table>${head}${body}</table>`;
      }

      function escapeHtml(s) {
        return s
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      async function runQuery() {
        const query = document.getElementById('query').value.trim();
        if (!query) {
          setStatus('Введите SQL-запрос.', 'err');
          return;
        }

        const r = await fetch('/api/sql/execute', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ query })
        });
        const data = await r.json();

        if (!r.ok) {
          setStatus(data.detail || 'Ошибка выполнения запроса.', 'err');
          return;
        }

        lastResult = data;
        setStatus('Запрос выполнен успешно.', 'ok');
        document.getElementById('output').innerHTML = renderTable(data);
      }

      async function checkTask() {
        const taskId = document.getElementById('taskSelect').value;
        const query = document.getElementById('query').value.trim();

        if (!taskId) {
          setStatus('Сначала выберите задачу.', 'err');
          return;
        }
        if (!query) {
          setStatus('Введите SQL-запрос.', 'err');
          return;
        }

        const r = await fetch(`/api/tasks/${taskId}/check`, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ query })
        });
        const data = await r.json();

        if (!r.ok) {
          setStatus(data.detail || 'Ошибка проверки.', 'err');
          return;
        }

        lastResult = data.result;
        setStatus(data.message || 'Проверка завершена.', data.is_correct ? 'ok' : 'info');
        document.getElementById('output').innerHTML = renderTable(data.result);
      }

      function clearEditor() {
        document.getElementById('query').value = '';
        setStatus('Редактор очищен.', 'info');
      }

      async function loadSchema() {
        const r = await fetch('/api/schema', { headers: authHeaders() });
        const data = await r.json();

        if (!r.ok) {
          setStatus(data.detail || 'Не удалось загрузить схему.', 'err');
          return;
        }

        setStatus('Схема базы данных загружена.', 'info');
        const html = Object.entries(data).map(([table, cols]) => `
          <div style="padding:10px; border-bottom:1px solid var(--border);">
            <div style="font-weight:700; margin-bottom:6px;">${escapeHtml(table)}</div>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
              ${cols.map(c => `<span class="pill">${escapeHtml(c.name)} <b>${escapeHtml(c.type)}</b></span>`).join('')}
            </div>
          </div>
        `).join('');
        document.getElementById('output').innerHTML = html || '<div class="empty">Нет данных.</div>';
      }

      async function loadProgress() {
        const r = await fetch('/api/progress', { headers: authHeaders() });
        const data = await r.json();

        if (!r.ok) {
          setStatus(data.detail || 'Не удалось загрузить прогресс.', 'err');
          return;
        }

        setStatus('Прогресс пользователя обновлён.', 'info');

        const historyRows = (data.history || []).map(x => `
          <tr>
            <td>${x.task_id}</td>
            <td>${x.is_correct ? '✅' : '❌'}</td>
            <td>${new Date(x.created_at).toLocaleString('ru-RU')}</td>
          </tr>
        `).join('');

        document.getElementById('output').innerHTML = `
          <div style="padding: 12px;">
            <div class="meta">
              <div class="pill">Решено задач: <b>${data.solved_tasks}</b></div>
              <div class="pill">Всего попыток: <b>${data.attempts}</b></div>
              <div class="pill">Успешность: <b>${data.success_rate}%</b></div>
            </div>
            <h4 style="margin:12px 0 8px;">Последние попытки</h4>
            <table>
              <tr><th>Task ID</th><th>Результат</th><th>Дата</th></tr>
              ${historyRows || '<tr><td colspan="3">Попыток пока нет.</td></tr>'}
            </table>
          </div>
        `;
      }

      function showLastResult() {
        if (!lastResult) {
          setStatus('Сначала выполните запрос или проверку.', 'info');
          return;
        }
        setStatus('Показан последний результат запроса.', 'info');
        document.getElementById('output').innerHTML = renderTable(lastResult);
      }

      (async () => {
        if (!token) return;
        const r = await fetch('/api/tasks', { headers: authHeaders() });
        if (r.ok) {
          showApp();
          await loadTasks();
          setStatus('Сессия восстановлена.', 'ok');
        } else {
          localStorage.removeItem('token');
          token = '';
        }
      })();
    </script>
  </body>
</html>
